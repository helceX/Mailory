name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgres://mailory:mailory@localhost:5432/mailory
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          { POSTGRES_USER: mailory, POSTGRES_PASSWORD: mailory, POSTGRES_DB: mailory }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mailory -d mailory" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22.12", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { target: [web, worker] }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/${{ matrix.target }}/Dockerfile -t mailory-${{ matrix.target }}:ci .
